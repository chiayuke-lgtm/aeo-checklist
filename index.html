<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AEO 優質企業審查清單</title><meta name="robots" content="noindex,nofollow"></head><body>
<style id="appcss">
:root{
  --bg:#F7F7F4; --surface:#FFFFFF; --ink:#22303A; --muted:#5D6B74;
  --line:#E3E5E0; --accent:#1F4E6B; --accent-ink:#FFFFFF; --accent-soft:#EAF1F5;
  --seal:#A8402B; --seal-soft:#F9EDE9; --ok:#2F7A57; --ok-soft:#E8F2EC;
  --chip:#EFF1EE;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12181D; --surface:#1A222A; --ink:#E6EBEE; --muted:#93A1AB;
    --line:#2A343D; --accent:#7FB3D3; --accent-ink:#0F1A22; --accent-soft:#1E2E3A;
    --seal:#E08A72; --seal-soft:#37231D; --ok:#6FBF97; --ok-soft:#1E3229;
    --chip:#232D35;
  }
}
:root[data-theme="dark"]{
  --bg:#12181D; --surface:#1A222A; --ink:#E6EBEE; --muted:#93A1AB;
  --line:#2A343D; --accent:#7FB3D3; --accent-ink:#0F1A22; --accent-soft:#1E2E3A;
  --seal:#E08A72; --seal-soft:#37231D; --ok:#6FBF97; --ok-soft:#1E3229;
  --chip:#232D35;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  font-size:15px; line-height:1.65;
}
.wrap{max-width:1080px; margin:0 auto; padding:28px 20px 80px}
header.top{border-bottom:2px solid var(--ink); padding-bottom:18px; margin-bottom:8px}
.eyebrow{font-size:12px; letter-spacing:.18em; color:var(--muted); text-transform:uppercase}
h1{
  font-family:"Songti TC","Noto Serif TC",serif; font-weight:700;
  font-size:clamp(26px,4vw,36px); margin:6px 0 4px; text-wrap:balance;
}
.sub{color:var(--muted); font-size:13.5px; max-width:46em}
.progress-line{display:flex; align-items:center; gap:12px; margin-top:14px}
.bar{flex:1; height:8px; background:var(--chip); border-radius:4px; overflow:hidden}
.bar>i{display:block; height:100%; width:0; background:var(--ok); transition:width .25s}
.pct{font-variant-numeric:tabular-nums; font-size:13px; color:var(--muted); white-space:nowrap}
.toolbar{
  display:flex; flex-wrap:wrap; gap:10px; align-items:center;
  position:sticky; top:0; z-index:5; background:var(--bg);
  padding:12px 0; border-bottom:1px solid var(--line); margin-bottom:20px;
}
.search{
  flex:1; min-width:180px; display:flex; align-items:center; gap:8px;
  background:var(--surface); border:1px solid var(--line); border-radius:6px; padding:7px 12px;
}
.search input{
  border:0; outline:0; background:transparent; color:var(--ink);
  font:inherit; width:100%;
}
.search svg{flex:none; opacity:.5}
.chips{display:flex; gap:6px}
.chip{
  border:1px solid var(--line); background:var(--surface); color:var(--muted);
  border-radius:999px; padding:6px 14px; font-size:13px; cursor:pointer; font-family:inherit;
}
.chip[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.chip:focus-visible,.btn:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.btn{
  border:1px solid var(--line); background:var(--surface); color:var(--muted);
  border-radius:6px; padding:6px 12px; font-size:13px; cursor:pointer; font-family:inherit;
}
.btn.danger{border-color:var(--seal); color:var(--seal); background:var(--seal-soft)}
#toast{
  position:fixed; left:50%; bottom:24px; transform:translate(-50%,12px);
  max-width:min(88vw,480px); background:var(--ink); color:var(--bg);
  font-size:13.5px; line-height:1.6; padding:12px 18px; border-radius:8px;
  opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; z-index:50;
}
#toast.show{opacity:1; transform:translate(-50%,0)}
@media (prefers-reduced-motion: reduce){ #toast{transition:none} }
.layout{display:grid; grid-template-columns:216px 1fr; gap:32px; align-items:start}
nav.side{position:sticky; top:64px}
nav.side a{
  display:flex; justify-content:space-between; align-items:baseline; gap:8px;
  text-decoration:none; color:var(--muted); font-size:13.5px;
  padding:7px 10px; border-left:2px solid var(--line);
}
nav.side a:hover{color:var(--ink); background:var(--accent-soft)}
nav.side a .n{font-variant-numeric:tabular-nums; font-size:12px}
nav.side a.done{border-left-color:var(--ok)}
nav.side a.done .n{color:var(--ok)}
section.chapter{margin-bottom:44px; scroll-margin-top:70px}
.ch-head{display:flex; align-items:baseline; gap:12px; border-bottom:1px solid var(--line); padding-bottom:8px; margin-bottom:4px}
.ch-head h2{
  font-family:"Songti TC","Noto Serif TC",serif; font-size:21px; margin:0; font-weight:700;
}
.ch-head .ch-num{
  font-size:12px; letter-spacing:.14em; color:var(--accent); white-space:nowrap;
  border:1px solid var(--accent); border-radius:3px; padding:2px 8px;
}
.ch-head .ch-pct{margin-left:auto; font-size:12.5px; color:var(--muted); font-variant-numeric:tabular-nums; white-space:nowrap}
.sec{margin-top:22px}
.sec h3{font-size:15.5px; margin:0 0 6px; font-weight:600}
.sec h3 .code{color:var(--accent); font-variant-numeric:tabular-nums; margin-right:6px}
.sec .note{font-size:13px; color:var(--muted); margin:0 0 6px}
ul.items{list-style:none; margin:0; padding:0}
li.item{border-bottom:1px solid var(--line)}
li.item:last-child{border-bottom:0}
li.item.hide{display:none}
label.row{display:flex; gap:12px; padding:10px 6px; cursor:pointer; align-items:flex-start}
label.row:hover{background:var(--accent-soft)}
.box{
  flex:none; width:18px; height:18px; margin-top:3px;
  border:1.5px solid var(--muted); border-radius:3px; background:var(--surface);
  display:grid; place-items:center; color:transparent;
}
.item input{position:absolute; opacity:0; pointer-events:none}
.item input:checked ~ .box, .item input:checked + .box{border-color:var(--ok); background:var(--ok); color:#fff}
.item input:focus-visible ~ .box{outline:2px solid var(--accent); outline-offset:2px}
.box svg{width:12px; height:12px}
.itxt{flex:1}
.item input:checked ~ .itxt .t{color:var(--muted)}
.t b{font-weight:600}
.pit{
  display:block; font-size:13px; color:var(--seal); margin-top:2px;
}
.pit::before{content:"常見缺失"; font-size:11px; border:1px solid var(--seal); border-radius:3px; padding:0 5px; margin-right:7px; vertical-align:1px}
.hot{
  display:inline-block; font-size:11px; color:var(--seal); background:var(--seal-soft);
  border-radius:3px; padding:1px 7px; margin-left:8px; vertical-align:2px; white-space:nowrap;
}
.notebtn{
  flex:none; align-self:flex-start; margin-top:4px;
  border:1px dashed var(--line); background:transparent; color:var(--muted);
  border-radius:5px; font-size:11.5px; padding:2px 8px; cursor:pointer; font-family:inherit;
  white-space:nowrap;
}
.notebtn:hover{color:var(--accent); border-color:var(--accent)}
.notebtn:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.notewrap{margin:0 6px 0 48px}
.note{
  display:block; font-size:13px; color:var(--ink); background:var(--accent-soft);
  border-left:3px solid var(--accent); padding:6px 10px; border-radius:0 6px 6px 0;
  margin-bottom:10px; white-space:pre-wrap;
}
.note::before{
  content:"筆記"; font-size:11px; color:var(--accent); border:1px solid var(--accent);
  border-radius:3px; padding:0 5px; margin-right:7px;
}
.notearea{
  width:100%; min-height:64px; font:inherit; font-size:13.5px; color:var(--ink);
  background:var(--surface); border:1px solid var(--accent); border-radius:6px;
  padding:8px 10px; margin-bottom:4px; resize:vertical; outline:0; box-sizing:border-box;
}
.noterow{margin-bottom:10px}
.thumbs{display:flex; flex-wrap:wrap; gap:10px; margin:0 6px 0 48px}
.thumbs:empty{display:none}
.thumb{position:relative; margin-bottom:10px}
.thumb img{max-height:110px; max-width:220px; display:block; border:1px solid var(--line); border-radius:6px}
.thumb .imgdel{
  position:absolute; top:-8px; right:-8px; width:22px; height:22px; border-radius:50%;
  border:1px solid var(--seal); background:var(--surface); color:var(--seal);
  font-size:12px; line-height:1; cursor:pointer; display:grid; place-items:center; padding:0;
}
.thumb .imgdel:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.empty{color:var(--muted); font-size:14px; padding:30px 6px; display:none}
footer{margin-top:48px; color:var(--muted); font-size:12.5px; border-top:1px solid var(--line); padding-top:14px}
@media (max-width:820px){
  .layout{grid-template-columns:1fr}
  nav.side{position:static; display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px}
  nav.side a{border:1px solid var(--line); border-radius:999px; padding:4px 12px}
}
.sec.hide,section.chapter.hide{display:none}
.profilebar{
  display:flex; flex-wrap:wrap; gap:8px; align-items:center;
  padding:14px 0 0; font-size:13.5px;
}
.profilebar .plabel{color:var(--muted); letter-spacing:.08em; font-size:12px}
.profilebar select{
  font:inherit; color:var(--ink); background:var(--surface);
  border:1px solid var(--line); border-radius:6px; padding:6px 10px;
  flex:1 1 12em; min-width:10em; max-width:24em;
}
.profilebar .pmeta{color:var(--muted); font-size:12.5px; margin-left:auto; font-variant-numeric:tabular-nums}
.nameform{display:flex; flex-wrap:wrap; gap:8px; align-items:center; padding:10px 0 0}
.nameform[hidden]{display:none}
.nameform input{
  font:inherit; color:var(--ink); background:var(--surface);
  border:1px solid var(--accent); border-radius:6px; padding:6px 10px; width:13em; outline:0;
}
.nameform input.err{border-color:var(--seal)}
.nameform .nameerr{color:var(--seal); font-size:12.5px}
.printmeta{display:none}
#totop{
  position:fixed; right:20px; bottom:24px; width:42px; height:42px;
  border-radius:50%; border:1px solid var(--line); background:var(--surface); color:var(--muted);
  cursor:pointer; display:grid; place-items:center; z-index:40;
  opacity:0; pointer-events:none; transition:opacity .2s;
  box-shadow:0 2px 10px rgba(0,0,0,.15);
}
#totop.show{opacity:1; pointer-events:auto}
#totop:hover{color:var(--accent); border-color:var(--accent)}
#totop:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
#totop svg{width:18px; height:18px}
@media (prefers-reduced-motion: reduce){ #totop{transition:none} }
@page{size:A4; margin:12mm}
html.pmode .toolbar,html.pmode nav.side,html.pmode .profilebar,html.pmode .nameform,
html.pmode .cloudline,html.pmode .addrow,html.pmode #totop,html.pmode .notebtn,
html.pmode .notearea,html.pmode .noterow,html.pmode .thumb .imgdel,html.pmode #toast{display:none}
html.pmode body{background:#fff; color:#000}
html.pmode .layout,html.pmode main{display:block}
html.pmode .wrap{display:block; width:186mm; max-width:186mm; margin:0; padding:0}
html.pmode .printmeta{display:block; font-size:12.5px; margin-top:8px}
html.pmode .note{background:transparent}
html.pmode .thumbs{display:block}
html.pmode .thumb{display:block; margin:0 0 8px}
html.pmode .thumb img{max-height:200px; max-width:320px}
html.pmode label.row{display:block; position:relative; padding:10px 6px 10px 34px}
html.pmode .box{position:absolute; left:6px; top:13px; margin-top:0}
@media print{
  .toolbar,nav.side,.profilebar,.nameform,.cloudline,.addrow,#totop,.notebtn,.notearea,.noterow,.thumb .imgdel,#toast{display:none}
  body{background:#fff; color:#000}
  .layout,main{display:block}
  .wrap{display:block; width:186mm; max-width:186mm; margin:0; padding:0}
  .printmeta{display:block; font-size:12.5px; margin-top:8px}
  .note{background:transparent}
  .thumbs{display:block}
  .thumb{display:block; margin:0 0 8px; break-inside:avoid; page-break-inside:avoid}
  .thumb img{max-height:200px; max-width:320px}
  label.row{
    display:block; position:relative; padding:10px 6px 10px 34px;
    break-inside:avoid; page-break-inside:avoid;
  }
  .box{position:absolute; left:6px; top:13px; margin-top:0}
  .note,.notewrap{break-inside:avoid; page-break-inside:avoid}
  .sec h3{break-after:avoid; page-break-after:avoid}
  .ch-head{break-after:avoid; page-break-after:avoid}
  .pb{break-before:page; page-break-before:always}
}
@media (prefers-reduced-motion: reduce){ .bar>i{transition:none} }
.cloudline{font-size:12.5px; color:var(--muted); margin:-12px 0 16px}
.cloudline.dirty{color:var(--seal)}
.btn:disabled{opacity:.5; cursor:default}
.addrow{margin:6px 6px 0 48px; display:flex; gap:8px; align-items:center}
.custominput{
  flex:1; min-width:0; font:inherit; font-size:13.5px; color:var(--ink);
  background:var(--surface); border:1px solid var(--accent); border-radius:6px;
  padding:6px 10px; outline:0;
}
.cbadge{
  display:inline-block; font-size:11px; color:var(--accent); border:1px solid var(--accent);
  border-radius:3px; padding:0 5px; margin-left:8px; vertical-align:2px; white-space:nowrap;
}
.notebtn.armed{color:var(--seal); border-color:var(--seal); background:var(--seal-soft)}
#pdfov{position:fixed; inset:0; z-index:100; background:rgba(15,20,25,.97); overflow:auto; -webkit-overflow-scrolling:touch}
.pdfov-bar{
  position:sticky; top:0; z-index:2; display:flex; gap:12px; align-items:center; justify-content:space-between;
  padding:10px 14px; background:#0F1419; color:#E6EBEE; font-size:13px; line-height:1.5;
}
.pdfov-pages{display:flex; flex-direction:column; align-items:center; gap:14px; padding:16px}
.pdfov-pages img{width:min(94vw,700px); background:#fff; box-shadow:0 2px 14px rgba(0,0,0,.4)}
</style>

<div hidden></div>
<template id="shell">
<div class="wrap">
<header class="top">
  <h1>優質企業審查清單</h1>
  <div class="progress-line">
    <div class="bar"><i id="totalbar"></i></div>
    <span class="pct" id="totalpct">0 / 0</span>
  </div>
  <div class="printmeta" id="printmeta"></div>
</header>

<div class="profilebar">
  <span class="plabel">審查對象</span>
  <select id="profile" aria-label="切換審查對象"></select>
  <button class="btn" id="addprof">＋新增</button>
  <button class="btn" id="renameprof">重新命名</button>
  <button class="btn" id="delprof">刪除</button>
  <span class="pmeta" id="pmeta"></span>
</div>
<div class="nameform" id="nameform" hidden>
  <input id="nameinput" type="text" placeholder="對象名稱" maxlength="40" aria-label="對象名稱">
  <button class="btn" id="nameok">確定</button>
  <button class="btn" id="namecancel">取消</button>
  <span class="nameerr" id="nameerr" role="alert"></span>
</div>

<div class="toolbar">
  <div class="search">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="搜尋項次或關鍵字，如 3.6、識別證…" aria-label="搜尋檢核項目">
  </div>
  <div class="chips" role="group" aria-label="篩選">
    <button class="chip" data-f="all" aria-pressed="true">全部</button>
    <button class="chip" data-f="todo" aria-pressed="false">未完成</button>
    <button class="chip" data-f="hot" aria-pressed="false">高頻缺失</button>
  </div>
  <button class="btn" id="copybtn">複製全文</button>
  <button class="btn" id="pdfbtn">輸出 PDF</button>
  <button class="btn" id="printbtn">列印</button>
  <button class="btn" id="resetbtn">重設勾選</button>
  <button class="btn" id="cloudbtn">☁️ 儲存雲端</button>
  <button class="btn" id="bakbtn">匯出備份</button>
  <button class="btn" id="restorebtn">還原備份</button>
</div>
<div class="cloudline" id="cloudline"></div>
<div class="nameform" id="syncform" hidden>
  <input id="syncemail" type="email" placeholder="Email" autocomplete="username" aria-label="同步帳號 Email">
  <input id="syncpass" type="password" placeholder="密碼" autocomplete="current-password" aria-label="同步密碼">
  <button class="btn" id="syncok">登入</button>
  <button class="btn" id="synccancel">取消</button>
  <span class="nameerr" id="syncerr" role="alert"></span>
</div>
<div class="nameform" id="restoreform" hidden>
  <textarea id="restoretext" class="notearea" style="min-height:80px" placeholder="把先前匯出的備份內容貼到這裡（或按「選擇備份檔」）" aria-label="備份內容"></textarea>
  <button class="btn" id="restorefile">選擇備份檔</button>
  <button class="btn" id="restoreok">確定還原</button>
  <button class="btn" id="restorecancel">取消</button>
</div>
<input type="file" id="imgpick" accept="image/*" multiple hidden>
<input type="file" id="bakpick" accept=".json,application/json,text/plain" hidden>

<div class="layout">
  <nav class="side" id="sidenav" aria-label="章節"></nav>
  <main id="main">
    <p class="empty" id="empty">沒有符合條件的項目。</p>
  </main>
</div>

</div>

<button id="totop" aria-label="回到最上方" title="回到最上方">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="m5.5 11.5 6.5-6.5 6.5 6.5"/></svg>
</button>
</template>

  try{
    const el=document.getElementById("cloudstate");

const REMAP={
 "3.2.0":"3.1.6","3.2.1":"3.1.7","3.2.2":"3.1.8",
 "4.5.2":"4.6.0","4.5.3":"4.7.0","4.5.4":"4.7.1","4.5.5":"4.5.2",

function migrateProfile(p){
  if(p.v>=3)return;
  const mv=(o,M)=>{const n={};Object.entries(o||{}).forEach(([k,val])=>{n[M[k]||k]=val});return n};
  if(!(p.v>=2)){
    p.state=mv(p.state,REMAP); p.notes=mv(p.notes,REMAP); p.imgs=mv(p.imgs,REMAP);
  }
  p.state=mv(p.state,REMAP3); p.notes=mv(p.notes,REMAP3); p.imgs=mv(p.imgs,REMAP3);
  p.v=3;
}
function mergeCloud(payload){
  Object.entries(payload.db.profiles).forEach(([id,p])=>{
    const lp=db.profiles[id];
    if(!lp||(p.updated||0)>(lp.updated||0))db.profiles[id]=p;
  });
  if(!db.profiles[db.current]){
    db.current=db.profiles[payload.db.current]?payload.db.current:Object.keys(db.profiles)[0];
  }
  Object.entries(payload.images||{}).forEach(([k,d])=>{if(!imgGet(k))imgPut(k,d)});
  if(payload.db.custom){
    if(!db.custom)db.custom={};
    Object.entries(payload.db.custom).forEach(([code,items])=>{
      const loc=db.custom[code]||(db.custom[code]=[]);
      items.forEach(x=>{if(!loc.some(y=>y.id===x.id))loc.push(x)});
    });
  }
}
function loadDb(){
  let hadLocal=true;
  try{db=JSON.parse(localStorage.getItem(KEY)||"null")}catch(e){db=null}
  if(!db||typeof db!=="object"||!db.profiles||!Object.keys(db.profiles).length){
    let old=null;
    try{old=JSON.parse(localStorage.getItem("aeo-checklist-v1")||"null")}catch(e){}
    const migrated=old&&typeof old==="object"&&Object.keys(old).length>0;
    hadLocal=!!migrated;
    const id="p"+Date.now().toString(36);
    db={current:id,profiles:{[id]:{name:"預設對象",state:migrated?old:{},updated:migrated?Date.now():null}}};
  }
  const cloud=readCloud();
  if(cloud){
    cloudSavedAt=cloud.saved||null;
    if(!hadLocal){
      db=cloud.db;
      Object.entries(cloud.images||{}).forEach(([k,d])=>{if(!imgGet(k))imgPut(k,d)});
    }else{
      mergeCloud(cloud);
    }
  }
  if(!db.profiles[db.current])db.current=Object.keys(db.profiles)[0];
  if(!db.custom)db.custom={};
  Object.values(db.profiles).forEach(p=>{migrateProfile(p);if(!p.notes)p.notes={};if(!p.imgs)p.imgs={}});
  save();
}
const cur=()=>db.profiles[db.current];

  try{
    const rq=indexedDB.open("aeo-imgs",1);
    rq.onupgradeneeded=()=>rq.result.createObjectStore("imgs");
    rq.onsuccess=()=>{idb=rq.result;res(true)};
    rq.onerror=()=>res(false);
  }catch(e){res(false)}
});
const idbGet=k=>idbReady.then(ok=>ok?new Promise(res=>{
  const r=idb.transaction("imgs").objectStore("imgs").get(k);
  r.onsuccess=()=>res(r.result||null); r.onerror=()=>res(null);
}):null);
const idbDel=k=>idbReady.then(ok=>ok&&new Promise(res=>{
  const t=idb.transaction("imgs","readwrite");
  t.objectStore("imgs").delete(k);
  t.oncomplete=()=>res(true); t.onerror=()=>res(false);
}));

const blobToDataURL=blob=>new Promise(res=>{
  const fr=new FileReader();
  fr.onload=()=>res(fr.result); fr.onerror=()=>res(null);
  fr.readAsDataURL(blob);
});
async function compressToDataURL(file){
  try{
    const url=URL.createObjectURL(file);
    const img=await new Promise((res,rej)=>{
      const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=url;
    });
    const draw=(max,q)=>{
      let w=img.naturalWidth,h=img.naturalHeight;
      if(Math.max(w,h)>max){const r=max/Math.max(w,h);w=Math.round(w*r);h=Math.round(h*r)}
      const c=document.createElement("canvas"); c.width=w; c.height=h;
      c.getContext("2d").drawImage(img,0,0,w,h);
      return c.toDataURL("image/jpeg",q);
    };
    let d=draw(1200,0.78);
    if(d.length>500000)d=draw(900,0.6);
    URL.revokeObjectURL(url);
    return d;
  }catch(e){return await blobToDataURL(file)}
}

function refresh(){
  let total=0, done=0, visible=0;
  DATA.forEach(ch=>{

    document.querySelectorAll(`#ch-${ch.id} .sec`).forEach(secEl=>{
      let secVisible=0;
      secEl.querySelectorAll("li.item").forEach(li=>{
        const checked=li.querySelector("input").checked;
        ct++; if(checked)cd++;
        const hot=li.dataset.hot==="1";
        const matchF = filter==="all" || (filter==="todo"&&!checked) || (filter==="hot"&&hot);
        const matchQ = !query || li.dataset.text.includes(query) || (cur().notes[li.dataset.id]||"").toLowerCase().includes(query);

        li.classList.toggle("hide",!show);

      });
      secEl.classList.toggle("hide",secVisible===0);

    });
    document.getElementById("ch-"+ch.id).classList.toggle("hide",chVisible===0);
    total+=ct; done+=cd;
    const pct=document.querySelector(`[data-chpct="${ch.id}"]`);
    if(pct)pct.textContent=`${cd} / ${ct}`;
    const np=document.querySelector(`[data-navpct="${ch.id}"]`);

function paginate(){
  document.querySelectorAll(".pb").forEach(el=>el.classList.remove("pb"));
  const BUDGET=232*96/25.4;
  const units=[];
  document.querySelectorAll("section.chapter:not(.hide)").forEach(secEl=>{
    const chHead=secEl.querySelector(".ch-head");
    if(chHead)units.push({el:chHead,keep:true});
    secEl.querySelectorAll(".sec:not(.hide)").forEach(s=>{
      const h3=s.querySelector("h3");
      if(h3)units.push({el:h3,keep:true});
      s.querySelectorAll("li.item:not(.hide)").forEach(li=>{
        units.push({el:li.querySelector("label.row")});
        const nw=li.querySelector(".notewrap");
        if(nw&&nw.textContent.trim())units.push({el:nw});
        li.querySelectorAll(".thumb").forEach(t=>units.push({el:t}));
      });
    });
  });
  if(!units.length)return;
  const rs=units.map(u=>u.el.getBoundingClientRect());
  const hdr=document.querySelector("header.top");
  const base=hdr?hdr.getBoundingClientRect().top:rs[0].top;
  let y=rs[0].top-base, stick=false;
  units.forEach((u,i)=>{
    if(i>0)y+=Math.max(0,rs[i].top-(rs[i-1].top+rs[i-1].height));
    let need=rs[i].height, j=i;
    while(units[j].keep&&j+1<units.length){
      need+=Math.max(0,rs[j+1].top-(rs[j].top+rs[j].height))+rs[j+1].height;
      j++;
    }
    if(!stick&&y>0&&y+need>BUDGET){u.el.classList.add("pb");y=0;}
    y+=rs[i].height;
    stick=!!u.keep;
  });
}
let pgTimer=null;

  de.classList.add("pmode");

  try{paginate()}catch(e){}

}
function schedulePaginate(){clearTimeout(pgTimer); pgTimer=setTimeout(repaginate,300);}
// ===== 自製 PDF 輸出（不依賴瀏覽器列印排版，圖片絕不跨頁） =====
const INK="#22303A", MUTED="#5D6B74", SEAL="#A8402B", ACCENT="#1F4E6B", OK="#2F7A57", LINE="#E3E5E0";
function renderPdfPages(){
  const S=150/25.4;                       // 150dpi：每 mm 的像素數
  const W=Math.round(210*S), H=Math.round(297*S), M=Math.round(14*S);
  const maxW=W-2*M;
  const pages=[]; let g=null, y=0;
  const F=n=>`${n}px "PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif`;
  const FB=n=>`bold ${n}px "PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif`;
  function newPage(){
    const c=document.createElement("canvas"); c.width=W; c.height=H;
    g=c.getContext("2d"); g.fillStyle="#fff"; g.fillRect(0,0,W,H);
    y=M; pages.push(c);
  }
  const ensure=h=>{ if(y+h>H-M)newPage(); };
  function wrap(text,font,width){
    g.font=font; const lines=[]; let line="";
    for(const ch of String(text)){
      if(ch==="\n"){lines.push(line);line="";continue}
      if(line&&g.measureText(line+ch).width>width){lines.push(line);line=ch}
      else line+=ch;
    }
    if(line)lines.push(line);
    return lines.length?lines:[""];
  }
  function textBlock(text,font,color,x,width,lh){
    const lines=wrap(text,font,width);
    for(const ln of lines){
      if(y+lh>H-M)newPage();
      g.font=font; g.fillStyle=color;
      g.fillText(ln,x,y+lh*0.78);
      y+=lh;
    }
  }
  function drawBox(x,yy,size,checked){
    if(checked){
      g.fillStyle=OK; g.fillRect(x,yy,size,size);
      g.strokeStyle="#fff"; g.lineWidth=3; g.beginPath();
      g.moveTo(x+size*0.22,yy+size*0.55); g.lineTo(x+size*0.44,yy+size*0.76); g.lineTo(x+size*0.8,yy+size*0.26);
      g.stroke();
    }else{
      g.strokeStyle=MUTED; g.lineWidth=2; g.strokeRect(x,yy,size,size);
    }
  }
  newPage();
  // 頁首
  textBlock("優質企業審查清單",FB(46),INK,M,maxW,60);
  y+=6;
  textBlock(`審查對象：${cur().name}　｜　範圍：${filterLabel()}　｜　${fmt(Date.now())}　｜　${BUILD}`,F(21),MUTED,M,maxW,30);
  y+=6; g.fillStyle=INK; g.fillRect(M,y,maxW,3); y+=22;
  // 內容（依目前篩選的可見項目）
  document.querySelectorAll("section.chapter:not(.hide)").forEach(secEl=>{
    const badge=secEl.querySelector(".ch-num"), h2=secEl.querySelector(".ch-head h2");
    ensure(140);
    y+=14;
    textBlock(`${badge?badge.textContent:""}　${h2?h2.textContent:""}`,FB(34),INK,M,maxW,46);
    g.fillStyle=LINE; g.fillRect(M,y+2,maxW,2); y+=16;
    secEl.querySelectorAll(".sec:not(.hide)").forEach(s=>{
      const h3=s.querySelector("h3");
      ensure(110);
      y+=10;
      if(h3){
        const code=h3.querySelector(".code");
        const label=code?code.textContent+"　"+h3.textContent.slice(code.textContent.length):h3.textContent;
        textBlock(label,FB(26),ACCENT,M,maxW,36);
      }
      y+=4;
      s.querySelectorAll("li.item:not(.hide)").forEach(li=>{
        const checked=li.querySelector("input").checked;
        let t=li.querySelector(".t").textContent;
        if(li.classList.contains("custom"))t+="（自訂）";
        if(li.dataset.hot==="1")t+="【高頻缺失】";
        const bs=22, tx=M+bs+14, tw=maxW-bs-14;
        const tLines=wrap(t,F(23),tw);
        ensure(Math.min(tLines.length,2)*32+6);
        const boxY=y+5;
        drawBox(M,boxY,bs,checked);
        textBlock(t,F(23),INK,tx,tw,32);
        const pit=li.querySelector(".pit");
        if(pit)textBlock("常見缺失：" +pit.textContent,F(20),SEAL,tx,tw,28);
        const note=cur().notes[li.dataset.id];
        if(note){
          y+=4;
          const barTop=y, pageBefore=pages.length;
          textBlock("筆記：" +note,F(20),ACCENT,tx+10,tw-10,28);
          if(pages.length===pageBefore){g.fillStyle=ACCENT; g.fillRect(tx,barTop,4,y-barTop);}
        }
        li.querySelectorAll(".thumb img").forEach(img=>{
          const iw=img.naturalWidth||1, ih=img.naturalHeight||1;
          const availH=H-2*M-10;
          let dw=Math.min(maxW*0.72, iw), dh=dw*ih/iw;
          const maxH=Math.min(72*S, availH);
          if(dh>maxH){dh=maxH; dw=dh*iw/ih;}
          if(y+dh+10>H-M)newPage();
          try{g.drawImage(img,tx,y+4,dw,dh)}catch(e){}
          g.strokeStyle=LINE; g.lineWidth=1; g.strokeRect(tx,y+4,dw,dh);
          y+=dh+12;
        });
        y+=6;
        g.fillStyle=LINE; g.fillRect(M,y,maxW,1); y+=8;
      });
    });
  });
  // 頁碼
  pages.forEach((c,i)=>{
    const gg=c.getContext("2d");
    gg.font=F(18); gg.fillStyle=MUTED; gg.textAlign="center";
    gg.fillText(`${i+1} / ${pages.length}`,W/2,H-Math.round(M/2.5));
    gg.textAlign="left";
  });
  return pages.map(c=>({data:c.toDataURL("image/jpeg",0.85),w:c.width,h:c.height}));
}
function b64ToBytes(b64){
  const s=atob(b64); const a=new Uint8Array(s.length);
  for(let i=0;i<s.length;i++)a[i]=s.charCodeAt(i);
  return a;
}
function buildPdf(pages){
  const enc=new TextEncoder();
  const chunks=[]; let pos=0;
  const push=x=>{const b=typeof x==="string"?enc.encode(x):x; chunks.push(b); pos+=b.length;};
  const off=[];
  push("%PDF-1.4\n");
  const n=pages.length;
  const kids=pages.map((_,i)=>`${3+i*3} 0 R`).join(" ");
  off[1]=pos; push("1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n");
  off[2]=pos; push(`2 0 obj\n<< /Type /Pages /Kids [${kids}] /Count ${n} >>\nendobj\n`);
  pages.forEach((p,i)=>{
    const po=3+i*3, co=po+1, io=po+2;
    off[po]=pos;
    push(`${po} 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /XObject << /Im${i} ${io} 0 R >> >> /Contents ${co} 0 R >>\nendobj\n`);
    const cs=`q 595.28 0 0 841.89 0 0 cm /Im${i} Do Q`;
    off[co]=pos;
    push(`${co} 0 obj\n<< /Length ${cs.length} >>\nstream\n${cs}\nendstream\nendobj\n`);
    const jpg=b64ToBytes(p.data.split(",")[1]);
    off[io]=pos;
    push(`${io} 0 obj\n<< /Type /XObject /Subtype /Image /Width ${p.w} /Height ${p.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpg.length} >>\nstream\n`);
    push(jpg);
    push("\nendstream\nendobj\n");
  });
  const total=3+n*3;
  const xref=pos;
  let x=`xref\n0 ${total}\n0000000000 65535 f \n`;
  for(let i=1;i<total;i++)x+=String(off[i]).padStart(10,"0")+" 00000 n \n";
  push(x);
  push(`trailer\n<< /Size ${total} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`);
  const out=new Uint8Array(pos); let o=0;
  chunks.forEach(c=>{out.set(c,o);o+=c.length});
  return out;
}

        const file=new File([bytes],name,{type:"application/pdf"});

          await navigator.share({files:[file]});

      }catch(e){
        if(e&&e.name==="AbortError")return;

      }
    }
    try{
      const url=URL.createObjectURL(new Blob([bytes],{type:"application/pdf"}));
      const w=window.open(url,"_blank");

        toast("PDF 已在新分頁開啟。在新分頁按瀏覽器的「分享」→「列印」或「儲存到檔案」");

      a.href=URL.createObjectURL(new Blob([bytes],{type:"application/pdf"}));
      a.download=name; document.body.appendChild(a); a.click(); a.remove();
      toast("已嘗試下載 PDF");
      return;
    }
    showPdfOverlay(pages);
    toast("此環境無法直接輸出 PDF 檔"+(shareErr?"（"+shareErr+"）":"")+"，已改為逐頁預覽——長按各頁存到「照片」後即可整份列印");

  }

// ===== Supabase 雲端同步（本機優先，變更後自動上雲） =====
const IN_ARTIFACT=()=>!!(window.claude&&window.claude.use)||/(^|\.)claude\.ai$/.test(location.hostname);
const supaEnabled=()=>!!(SUPA.url&&SUPA.anon)&&!IN_ARTIFACT();
let supaTok=null, syncTimer=null, syncBusy=false, syncErr=null, lastSync=null, syncPending=false;
let uploadedImgs=new Set();
try{uploadedImgs=new Set(JSON.parse(localStorage.getItem("aeo-supaimgs")||"[]"))}catch(e){}
const persistUploaded=()=>{try{localStorage.setItem("aeo-supaimgs",JSON.stringify([...uploadedImgs]))}catch(e){}};
function supaLoadTok(){try{supaTok=JSON.parse(localStorage.getItem("aeo-supatok")||"null")}catch(e){supaTok=null}}
function supaSaveTok(){try{if(supaTok)localStorage.setItem("aeo-supatok",JSON.stringify(supaTok));else localStorage.removeItem("aeo-supatok")}catch(e){}}
async function supaLogin(email,pass){
  const r=await fetch(SUPA.url+"/auth/v1/token?grant_type=password",{
    method:"POST",headers:{apikey:SUPA.anon,"Content-Type":"application/json"},
    body:JSON.stringify({email:email,password:pass})
  });
  if(!r.ok)throw new Error(r.status===400?"帳號或密碼錯誤":"登入失敗（"+r.status+"）");
  const j=await r.json();
  supaTok={access_token:j.access_token,refresh_token:j.refresh_token,expires_at:Date.now()+(j.expires_in-60)*1000};
  supaSaveTok();
}
async function supaEnsureTok(){
  if(!supaTok)throw new Error("not-logged-in");
  if(Date.now()<supaTok.expires_at)return supaTok.access_token;
  const r=await fetch(SUPA.url+"/auth/v1/token?grant_type=refresh_token",{
    method:"POST",headers:{apikey:SUPA.anon,"Content-Type":"application/json"},
    body:JSON.stringify({refresh_token:supaTok.refresh_token})
  });
  if(!r.ok){
    if(r.status===400||r.status===401){supaTok=null;supaSaveTok();updateCloudUI()}
    throw new Error("登入已過期，請重新登入");
  }
  const j=await r.json();
  supaTok={access_token:j.access_token,refresh_token:j.refresh_token,expires_at:Date.now()+(j.expires_in-60)*1000};
  supaSaveTok();
  return supaTok.access_token;
}
async function supaFetch(path,opt){
  const tok=await supaEnsureTok();
  opt=opt||{};
  opt.headers=Object.assign({apikey:SUPA.anon,Authorization:"Bearer "+tok},opt.headers||{});
  const r=await fetch(SUPA.url+path,opt);
  if(!r.ok)throw new Error(path.split("?")[0].split("/").pop()+" "+r.status);
  return r;
}
function scheduleSync(){
  if(!supaEnabled()||!supaTok)return;
  syncPending=true;
  clearTimeout(syncTimer);
  syncTimer=setTimeout(syncUp,2500);
  updateCloudUI();
}
async function syncUp(){
  if(syncBusy){scheduleSync();return}
  if(!supaEnabled()||!supaTok)return;
  syncBusy=true; syncPending=false; updateCloudUI();
  try{
    for(const p of Object.values(db.profiles)){
      for(const k of Object.values(p.imgs||{}).flat()){
        if(uploadedImgs.has(k))continue;
        const d=imgGet(k); if(!d)continue;
        await supaFetch("/storage/v1/object/evidence/"+encodeURIComponent(k)+".jpg",{
          method:"POST",headers:{"Content-Type":"image/jpeg","x-upsert":"true"},
          body:b64ToBytes(d.split(",")[1])
        });
        uploadedImgs.add(k); persistUploaded();
      }
    }
    const rows=Object.entries(db.profiles).map(([id,p])=>({
      id:id,name:p.name,updated:p.updated||0,
      data:{state:p.state||{},notes:p.notes||{},imgs:p.imgs||{},v:p.v||3}
    }));
    await supaFetch("/rest/v1/profiles_data",{
      method:"POST",headers:{"Content-Type":"application/json",Prefer:"resolution=merge-duplicates"},
      body:JSON.stringify(rows)
    });
    await supaFetch("/rest/v1/app_state",{
      method:"POST",headers:{"Content-Type":"application/json",Prefer:"resolution=merge-duplicates"},
      body:JSON.stringify([{id:"main",data:{custom:db.custom||{}},updated:Date.now()}])
    });
    lastSync=Date.now(); syncErr=null;
  }catch(e){
    syncErr=(e&&e.message)||"同步失敗";
    clearTimeout(syncTimer); syncTimer=setTimeout(syncUp,30000);
  }finally{
    syncBusy=false; updateCloudUI();
  }
}
async function syncDown(){
  const r=await supaFetch("/rest/v1/profiles_data?select=*");
  const rows=await r.json();
  rows.forEach(row=>{
    const lp=db.profiles[row.id];
    if(!lp||(row.updated||0)>(lp.updated||0)){
      const d=row.data||{};
      db.profiles[row.id]={name:row.name||"未命名",state:d.state||{},notes:d.notes||{},imgs:d.imgs||{},updated:row.updated||null,v:d.v||3};
    }
  });
  const r2=await supaFetch("/rest/v1/app_state?id=eq.main&select=*");
  const st=(await r2.json())[0];
  if(st&&st.data&&st.data.custom){
    if(!db.custom)db.custom={};
    Object.entries(st.data.custom).forEach(([code,items])=>{
      const loc=db.custom[code]||(db.custom[code]=[]);
      items.forEach(x=>{if(!loc.some(y=>y.id===x.id))loc.push(x)});
    });
  }
  Object.entries(db.profiles).forEach(([id,p])=>{
    const empty=!p.updated&&!Object.keys(p.state||{}).length&&!Object.keys(p.notes||{}).length&&!Object.keys(p.imgs||{}).length;
    if(empty&&p.name==="預設對象"&&Object.keys(db.profiles).length>1){
      delete db.profiles[id];
      supaDeleteProfile(id);
    }
  });
  if(!db.profiles[db.current])db.current=Object.keys(db.profiles)[0];
  Object.values(db.profiles).forEach(p=>{migrateProfile(p);if(!p.notes)p.notes={};if(!p.imgs)p.imgs={}});
  save();
  renderCustom(); renderProfiles(); applyState(); refresh();
  for(const p of Object.values(db.profiles)){
    for(const k of Object.values(p.imgs||{}).flat()){
      if(imgGet(k)){uploadedImgs.add(k);continue}
      try{
        const rr=await supaFetch("/storage/v1/object/evidence/"+encodeURIComponent(k)+".jpg");
        const d=await blobToDataURL(await rr.blob());
        if(d&&imgPut(k,d)){uploadedImgs.add(k)}
      }catch(e){}
    }
  }
  persistUploaded();
  applyState();
  lastSync=Date.now(); updateCloudUI();
}

async function cloudSave(){
  if(cloudBusy||cloudRO)return;
  if(!(window.claude&&window.claude.use)){
    toast("此環境不支援雲端儲存（請透過 claude.ai 的頁面連結開啟），請改用「匯出備份」");
    return;
  }
  cloudBusy=true; updateCloudUI();
  const withTimeout=(p,ms)=>Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej({code:"timeout"}),ms))]);
  try{
    const art=await withTimeout(window.claude.use("artifact"),12000);
    if(!art)throw {code:"not_granted"};
    const payload=buildCloudPayload();
    const html=pageSource(payload);
    sessionStorage.setItem("aeo-cloud-msg","已儲存到雲端（"+fmt(payload.saved)+"）。勾選、筆記與附圖已跟著本頁保存。");
    sessionStorage.setItem("aeo-scroll",String(window.scrollY||0));
    try{localStorage.removeItem(DIRTYKEY)}catch(e){}
    await withTimeout(art.publish(html),60000);
    cloudSavedAt=payload.saved;
  }catch(e){
    sessionStorage.removeItem("aeo-cloud-msg");
    sessionStorage.removeItem("aeo-scroll");
    try{localStorage.setItem(DIRTYKEY,"1")}catch(e2){}
    const code=e&&e.code;
    if(code==="conflict"){
      toast("雲端上已有更新的版本，頁面會自動重新載入；載入後請再按一次「儲存雲端」");
    }else if(code==="not_writer"||code==="not_granted"||code==="consent_required"||code==="capability_disabled"||code==="capability_removed"){
      cloudRO=true;
      toast("此檢視未取得雲端儲存權限（"+code+"）。最常見原因：分享連結釘住舊版本——請頁面擁有者到分享選單把版本更新到最新，再重新開啟本頁；若仍不行表示此帳號對頁面唯讀，請改用「匯出備份」");
    }else if(code==="too_large"){
      toast("資料量太大（多半是附圖太多），雲端儲存失敗。請刪除部分附圖，或改用「匯出備份」");
    }else if(code==="rate_limited"){
      toast("儲存太頻繁，請稍等一下再試");
    }else if(code==="timeout"){
      toast("連不上雲端儲存服務（逾時）。請確認是從 claude.ai 連結開啟、網路正常，稍後再試；不放心先按「匯出備份」");
    }else{
      toast("雲端儲存失敗（"+(code||String((e&&e.message)||e||"未知錯誤"))+"），請稍後再試；不放心的話請先按「匯出備份」");
    }
  }finally{cloudBusy=false; updateCloudUI()}
}
function dlFile(data,name,mime){
  try{
    const a=document.createElement("a");
    a.href=URL.createObjectURL(new Blob([data],{type:mime}));
    a.download=name; document.body.appendChild(a); a.click(); a.remove();
    return true;
  }catch(e){return false}
}
function exportBackup(){
  const data=JSON.stringify(buildCloudPayload());
  const name="AEO審查備份-"+new Date().toISOString().slice(0,10)+".json";
  if(!IN_ARTIFACT()){
    try{
      const file=new File([data],name,{type:"application/json"});
      if(navigator.canShare&&navigator.canShare({files:[file]})&&navigator.share){
        navigator.share({files:[file]})
          .then(()=>toast("備份檔已匯出——建議存到「檔案」的 iCloud Drive；還原時按「還原備份→選擇備份檔」"))
          .catch(e=>{
            if(!(e&&e.name==="AbortError")){
              if(dlFile(data,name,"application/json"))toast("備份檔已下載");
            }
          });
        return;
      }
    }catch(e){}
    if(dlFile(data,name,"application/json")){toast("備份檔已下載");return}
  }
  const ta=document.createElement("textarea");
  ta.style.cssText="position:fixed;left:-9999px;top:0";
  ta.value=data;
  document.body.appendChild(ta);
  ta.select(); ta.setSelectionRange(0,ta.value.length);
  let ok=false;
  try{ok=document.execCommand("copy")}catch(e){}
  ta.remove();
  if(ok){
    toast("備份內容已複製到剪貼簿。請開「備忘錄」或任何筆記 App 貼上保存；資料遺失時按「還原備份」再貼回來即可");
  }else{
    toast("此環境無法複製，備份失敗。請確認已按「☁️ 儲存雲端」");
  }
}
function doRestore(text){
  let payload=null;
  try{payload=JSON.parse(text)}catch(e){}
  if(!payload||!payload.db||!payload.db.profiles){toast("內容不是有效的備份，請確認貼上的是完整備份文字");return}
  mergeCloud(payload);
  Object.entries(db.profiles).forEach(([id,p])=>{
    const empty=!p.updated&&!Object.keys(p.state||{}).length&&!Object.keys(p.notes||{}).length&&!Object.keys(p.imgs||{}).length;
    if(empty&&p.name==="預設對象"&&Object.keys(db.profiles).length>1)delete db.profiles[id];
  });
  if(db.profiles[payload.db.current])db.current=payload.db.current;
  if(!db.profiles[db.current])db.current=Object.keys(db.profiles)[0];
  if(!db.custom)db.custom={};
  Object.values(db.profiles).forEach(p=>{migrateProfile(p);if(!p.notes)p.notes={};if(!p.imgs)p.imgs={}});
  save(); renderCustom(); renderProfiles(); applyState(); refresh();
  restoreForm.hidden=true;
  toast("備份已還原（每個對象取較新的版本合併）。記得按「☁️ 儲存雲端」讓還原後的資料上雲");
}

document.getElementById("bakbtn").addEventListener("click",exportBackup);

document.getElementById("restoreok").addEventListener("click",()=>{

});
bakPick.addEventListener("change",()=>{

  fr.onload=()=>doRestore(fr.result);
  fr.readAsText(f);
});

(async function migrateOldImgs(){
  const allKeys=Object.values(db.profiles).flatMap(p=>Object.values(p.imgs||{}).flat());
  let moved=false;
  for(const k of allKeys){
    if(imgGet(k))continue;
    const blob=await idbGet(k);
    if(!blob)continue;
    const d=await blobToDataURL(blob);
    if(d&&imgPut(k,d)){moved=true; idbDel(k)}
  }
  if(moved)applyState();
})();
