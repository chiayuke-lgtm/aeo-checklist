name: keep-supabase-alive
# Supabase 免費專案閒置約 7 天會暫停；每週 ping 兩次保持活躍。
# 需要在 repo Settings → Secrets 設定 SUPA_URL 與 SUPA_ANON。
on:
  schedule:
    - cron: "0 21 * * 1,4"   # 週一、週四 UTC 21:00（台北時間週二、週五 05:00）
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: ping supabase rest api
        run: |
          if [ -z "$SUPA_URL" ]; then echo "SUPA_URL secret not set; skip"; exit 0; fi
          curl -sf "$SUPA_URL/rest/v1/app_state?select=id&limit=1" \
            -H "apikey: $SUPA_ANON" -H "Authorization: Bearer $SUPA_ANON" > /dev/null \
            && echo "pinged ok"
        env:
          SUPA_URL: ${{ secrets.SUPA_URL }}
          SUPA_ANON: ${{ secrets.SUPA_ANON }}
